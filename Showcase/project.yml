name: DrawablyShowcase
options:
  bundleIdPrefix: dev.drawably
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Drawably:
    path: ..

targets:
  DrawablyShowcase:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: Drawably
        product: Drawably
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Drawably
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.drawably.showcase
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
